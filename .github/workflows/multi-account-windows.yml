name: Multi-account Windows checks
on:
  push:
    branches: [multi-account]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --manifest-path crates/irminsul-core/Cargo.toml --lib
      - run: cargo test --locked --manifest-path crates/irminsul-core/Cargo.toml -p auto-artifactarium --lib
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v6
        with:
          name: Irminsul-Multi-Account-Windows
          path: target/release/irminsul.exe
