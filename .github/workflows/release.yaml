name: Release multi-account Windows app
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this as a test release
        type: boolean
        default: true

jobs:
  release:
    if: github.ref_name == 'multi-account'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --manifest-path crates/irminsul-core/Cargo.toml --lib
      - run: cargo test --locked --manifest-path crates/irminsul-core/Cargo.toml -p auto-artifactarium --lib
      - run: cargo build --release --locked
      - name: Prepare portable executable
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'irminsul').version
          "value=$version" >> $env:GITHUB_OUTPUT
          Copy-Item target/release/irminsul.exe irminsul-windows-x64.exe
          $hash = (Get-FileHash irminsul-windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  irminsul-windows-x64.exe" | Set-Content SHA256SUMS.txt
      - uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.value }}
          commit: ${{ github.sha }}
          name: Irminsul Multi-account ${{ steps.version.outputs.value }}
          prerelease: ${{ inputs.prerelease }}
          artifacts: irminsul-windows-x64.exe,SHA256SUMS.txt
          body: |
            Standalone account snapshots for Windows 11 24H2 or newer (x64).
            Download irminsul-windows-x64.exe, start capture, then enter the game door.
            Select an account and any combination of artifacts, characters, weapons, and materials.
            See README and VERIFICATION.md for supported workflow and validation limits.
